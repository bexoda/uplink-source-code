[package]
name = "ur-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
os-keyring = ["ur-save/os-keyring"]

[dependencies]
ur-sim = { path = "../ur-sim" }
ur-save = { path = "../ur-save" }
ur-assets = { path = "../ur-assets" }
ur-audio = { path = "../ur-audio" }
cpal = "0.18"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
web-time = "1"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
cpal = { version = "0.18", features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Storage"] }
