[package]
name = "ur-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
os-keyring = ["ur-save/os-keyring"]

[dependencies]
ur-sim = { path = "../ur-sim" }
ur-save = { path = "../ur-save" }
ur-assets = { path = "../ur-assets" }
ur-audio = { path = "../ur-audio" }
cpal = "0.18"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
web-time = "1"
base64 = "0.22"
ehttp = { version = "0.7", features = ["json"] }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webbrowser = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
cpal = { version = "0.18", features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Storage", "Location", "History", "HtmlMetaElement"] }
