<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uplink_rust</title>
  <!-- The uplink_rust server for Uplink accounts (sign-in and sync). Empty: accounts are off. -->
  <meta name="uplink-rust-server" content="">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: #6080d0;
              font: 14px ui-monospace, Menlo, Consolas, monospace; }
    #status.hidden, #assets.hidden { display: none; }
    #assets { position: fixed; left: 50%; top: 58%; transform: translateX(-50%); width: min(420px, calc(100vw - 32px));
              box-sizing: border-box; padding: 12px 14px; background: #00003a; border: 1px solid #3050c0;
              color: #b0c0f0; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; }
    #assets p { margin: 0 0 8px; }
    #assets code { color: #ffffff; }
    #assets button { font: inherit; color: #ffffff; background: #10208a; border: 1px solid #5070e0;
                     padding: 4px 10px; cursor: pointer; }
    #assets button:hover { background: #2038b0; }
    #assets .msg { margin-top: 8px; color: #e0c070; min-height: 1em; }
  </style>
</head>
<body>
  <canvas id="gl_canvas"></canvas>
  <div id="status">loading uplink_rust…</div>
  <div id="assets" class="hidden">
    <p>uplink_rust uses your own copy of Uplink for the original look and sound.</p>
    <p>Pick <code>graphics.dat</code>, <code>fonts.dat</code>, <code>loading.dat</code>, <code>patch*.dat</code>,
       <code>sounds.dat</code> and <code>music.dat</code> from your Uplink folder. They stay in this browser. Nothing is uploaded.</p>
    <button id="pick">Choose Uplink files…</button>
    <input id="files" type="file" accept=".dat" multiple hidden>
    <div class="msg" id="assets_msg"></div>
  </div>
  <script type="module">
    import init, { start, add_asset, assets_done } from './pkg/ur_client.js';

    const status = document.getElementById('status');
    const panel = document.getElementById('assets');
    const msg = document.getElementById('assets_msg');
    const input = document.getElementById('files');

    // IndexedDB keeps the picked archives in this browser so a reload doesn't ask again.
    const DB = 'uplink_rust-assets', OLD_DB = 'ghostline-assets', STORE = 'files';
    const db = (name = DB) => new Promise((ok, fail) => {
      const r = indexedDB.open(name, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => ok(r.result);
      r.onerror = () => fail(r.error);
    });
    async function cached() {
      let files = await readAll(await db());
      if (files.length === 0) {
        // Files picked when the project was called Ghostline: copy them over once.
        const old = await db(OLD_DB);
        files = await readAll(old);
        old.close();
        for (const [name, buf] of files) await remember(name, buf);
        indexedDB.deleteDatabase(OLD_DB);
      }
      return files;
    }
    async function readAll(d) {
      return new Promise((ok, fail) => {
        const out = [], tx = d.transaction(STORE, 'readonly'), cur = tx.objectStore(STORE).openCursor();
        cur.onsuccess = () => { const c = cur.result; if (c) { out.push([c.key, c.value]); c.continue(); } else ok(out); };
        cur.onerror = () => fail(cur.error);
      });
    }
    async function remember(name, buf) {
      const d = await db();
      return new Promise((ok, fail) => {
        const tx = d.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(buf, name);
        tx.oncomplete = ok; tx.onerror = () => fail(tx.error);
      });
    }
    async function forget() {
      const d = await db();
      d.transaction(STORE, 'readwrite').objectStore(STORE).clear();
    }

    function finish() {
      const err = assets_done();
      if (err) { msg.textContent = err; panel.classList.remove('hidden'); return false; }
      panel.classList.add('hidden');
      return true;
    }

    document.getElementById('pick').onclick = () => input.click();
    input.onchange = async () => {
      msg.textContent = 'reading…';
      for (const f of input.files) {
        const buf = await f.arrayBuffer();
        if (add_asset(f.name, new Uint8Array(buf))) {
          try { await remember(f.name.toLowerCase(), buf); } catch (e) { console.warn('not cached', e); }
        }
      }
      input.value = '';
      msg.textContent = '';
      finish();
    };

    try {
      await init();
      await start('gl_canvas');
      status.classList.add('hidden');
    } catch (e) {
      status.textContent = 'Could not start: ' + e + ' (WebGL2 is required)';
      console.error(e);
    }

    // ?forget-assets drops the cached files; otherwise reuse them, or ask.
    let loaded = false;
    try {
      if (new URLSearchParams(location.search).has('forget-assets')) await forget();
      const files = await cached();
      for (const [name, buf] of files) add_asset(name, new Uint8Array(buf));
      loaded = files.length > 0 && finish();
    } catch (e) {
      console.warn('asset cache unavailable', e);
    }
    // A site allowed to host the Uplink files puts them in ./dat/ next to this page (dev.ps1 does
    // this for your own machine). Without them, each player picks their own copy.
    if (!loaded) {
      try {
        for (const name of ['graphics.dat', 'fonts.dat', 'loading.dat', 'patch.dat', 'patch2.dat', 'patch3.dat', 'sounds.dat', 'music.dat']) {
          const r = await fetch('dat/' + name);
          // A server that answers every path with its home page is not hosting the file.
          const hosted = r.ok && !(r.headers.get('content-type') || '').includes('text/html');
          if (hosted) add_asset(name, new Uint8Array(await r.arrayBuffer()));
          else if (name === 'graphics.dat') break;
        }
        loaded = !assets_done();
      } catch (e) {
        console.warn('hosted assets unavailable', e);
      }
    }
    if (!loaded) panel.classList.remove('hidden');
  </script>
</body>
</html>
