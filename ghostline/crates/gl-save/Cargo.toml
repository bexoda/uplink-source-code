[package]
name = "gl-save"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
# OS keychain integration (macOS Keychain, Windows Credential Manager, Linux keyutils).
os-keyring = ["dep:keyring"]

[dependencies]
gl-sim = { path = "../gl-sim" }
serde.workspace = true
postcard.workspace = true
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native", "windows-native", "linux-native"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3"
postcard.workspace = true
